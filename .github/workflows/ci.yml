name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build web and PDF worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build PDF worker image
        run: docker build --file dockerfile.worker --tag nihon-pdf-worker:ci .

      - name: Check PDF runtime in the worker image
        run: >-
          docker run --rm nihon-pdf-worker:ci node --input-type=module -e
          'await import("@napi-rs/canvas"); await import("pdfjs-dist/legacy/build/pdf.mjs");'
